output: svg # only svg available at the moment
theme: light # color theme (light or dark)

debugMode: false

fileOutput:
  directory: './out'
  fileNamePattern: 'Battletech Inner Sphere_{{ERAYEAR}}_{{ERANAME}}.svg' # SYSTEMINDEX, SYSTEMID, SYSTEMNAME, ERAINDEX, ERAID, ERAYEAR, ERANAME

localFileConfig:
  # The local directory containing the CSV data files.
  # If using a relative path, the directory is interpreted to be relative to this project's main directory.
  directory: './data/'
  # The filename of the systems CSV data file
  systemsFilename: 'Sarna Unified Cartography Kit (Official) - Systems CSV Export.csv'
  # The filename of the factions CSV data file
  factionsFilename: 'Sarna Unified Cartography Kit (Official) - Factions CSV Export.csv'
  # The filename of the era description CSV (optional, auto-discovered if omitted)
  descriptionFilename: 'Sarna Unified Cartography Kit (Official) - Systems Sheet Description.csv'
  # Specify CSV as the data source type
  dataSourceType: 'csv'

eras: # the eras to create images for - either a list of era indices (0-based), or empty for all eras
  - 16 # 3025
  #- 20 # 3050
  #- 30 # 3059d
  #- 38 # 3095

dimensions: # output image pixel size
  width: 1450
  height: 1200

mapLayers: # the different layers showing maps
  - name: basemap # basemap layer
    mapUnitDimensions: # dimensions of the basemap (in map units)
      width: 1450
      height: 1200
    focus: # the focus point of the main map (in map units)
      point:
        x: 75
        y: -30
    elements:
      systems: true # display systems (as dots)
      systemLabels: true # display system names
      borders:
        - display: factions # first-level (faction) borders
          curveBorderEdges: true
          borderLabels: true # display border labels

overlays: # other items on top of the map layers
  #- type: text # map title
  #  attributes: # attributes specific to this type of overlay
  #    text: '?'

  - name: sarna-logo
    type: svgElement # the sarna logo svg paths
    attributes: # attributes specific to this type of overlay
      cssTemplate: sarna-logo.css.tpl
      svgTemplate: sarna-logo.svg.tpl
      scale: 1.5
    position: # the logo's pixel position (top left point)
      x: 10
      y: 10
  - name: main-map-scale
    type: scale # a scale displaying the relation of pixels to map units
    attributes:
      pixelsPerMapUnit: 1
      max: 500 # maximum unit shown
      step: 100 # color change after this many units
      scaleHeight: 12
      labelsPosition: below
    position: # the scale's pixel position (top left point of the scale bar)
      x: 900
      y: 1140
  - name: main-map-scale-frame
    type: rectangle
    attributes:
      width: 500
      height: 12
      strokeWidth: 3
    position:
      x: 900
      y: 1140

